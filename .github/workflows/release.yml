name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Match tag and package version
        shell: python
        run: |
          import os
          import tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}"
      - run: python scripts/release_check.py --require-clean
      - run: python scripts/package_release.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: exitpreflight-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
