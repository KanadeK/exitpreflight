name: Bug report
description: Report a reproducible parser, report, or integrity-check problem using synthetic data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real exports, mailbox data, private URLs, or unredacted reports.
  - type: input
    id: version
    attributes:
      label: ExitPreflight version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Input type
      options: [Directory, ZIP, TAR/TAR.GZ/TGZ, Slack JSON, Gmail MBOX/Takeout, Notion, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction and command
      description: Include the smallest invented file tree/archive that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used synthetic data and removed private paths, URLs, tokens, and message content.
          required: true
